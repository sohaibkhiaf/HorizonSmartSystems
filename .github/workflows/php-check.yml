name: PHP Syntax & Code Format Check

on:
  push:
  pull_request:

jobs:
  php-quality:
    name: PHP Syntax & Format (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check PHP Syntax (php -l)
        run: |
          find app bootstrap config database lang public resources routes tests -type f -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Check PHP Code Formatting (Laravel Pint)
        run: ./vendor/bin/pint --test
