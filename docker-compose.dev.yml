services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: hss_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Horizon Smart Systems"
      APP_ENV: local
      APP_KEY: "base64:uPI1GWqZ5DQ2WP5IcGKPqtUAI5XVU+iBkSyR0wD0Djc="
      APP_DEBUG: "true"
      APP_TIMEZONE: UTC
      APP_URL: "http://localhost:8000"
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: hss_db
      DB_USERNAME: hss_user
      DB_PASSWORD: hss_password
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hss_net

  db:
    image: mariadb:10.4
    container_name: hss_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hss_db
      MYSQL_USER: hss_user
      MYSQL_PASSWORD: hss_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./hss_db.sql:/docker-entrypoint-initdb.d/hss_db.sql:ro
      - hss_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hss_net

networks:
  hss_net:
    driver: bridge

volumes:
  hss_db_data:
    driver: local
